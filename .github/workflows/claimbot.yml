name: claimbot

# Roda o bot na nuvem do GitHub, de graça, sem usar nada do seu PC.
# Cada execucao dura 5h59; o cron dispara a cada 6h (minuto quebrado para fugir
# do pico do :00, que e quando o GitHub mais atrasa o inicio).
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: claimbot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # commit de atividade: o GitHub desativa cron de repositorio parado ha 60 dias
      - name: heartbeat
        continue-on-error: true
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
          git config user.name claimbot
          git config user.email claimbot@users.noreply.github.com
          git add .heartbeat
          git commit -q -m "heartbeat" || true
          git push origin HEAD:main || true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: conferir secret
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::Configure o secret TELEGRAM_BOT_TOKEN"
            exit 1
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: rodar
        run: node src/index.js --for 21540
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_CLAIM_SOL: ${{ vars.MIN_CLAIM_SOL || '10' }}
          MAX_MCAP_USD: ${{ vars.MAX_MCAP_USD || '500000' }}
          WATCH_AMM: ${{ vars.WATCH_AMM || 'true' }}
          STARTUP_MESSAGE: 'false'
          CYCLE_SUMMARY: 'false'
          LOG_LEVEL: info

      - name: avisar falha
        if: failure()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ ClaimBot parou com erro. O próximo ciclo tenta de novo automaticamente."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
