name: claimbot

# Roda o bot na nuvem do GitHub, de graça, sem usar nada do seu PC.
# Cada execucao dura 5h59; o cron dispara a cada 6h (com minuto quebrado para
# fugir do pico do :00, que e quando o GitHub mais atrasa o inicio).
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: conferir secret
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::Configure o secret TELEGRAM_BOT_TOKEN"
            exit 1
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: rodar
        run: node src/index.js --for 21540
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_CLAIM_SOL: ${{ vars.MIN_CLAIM_SOL || '10' }}
          MAX_MCAP_USD: ${{ vars.MAX_MCAP_USD || '500000' }}
          WATCH_AMM: ${{ vars.WATCH_AMM || 'true' }}
          LOG_LEVEL: info
